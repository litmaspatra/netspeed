name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
      - name: Check size (<1 MB)
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk netspeed-unsigned.apk
          SIZE=$(stat -c%s netspeed-unsigned.apk); echo "APK size: $SIZE bytes"
          [ "$SIZE" -lt 1048576 ]
      - uses: actions/upload-artifact@v4
        with:
          name: netspeed-unsigned-apk
          path: netspeed-unsigned.apk
