name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
      - name: Check size (<1 MB)
        run: |
          cp app/build/outputs/apk/release/app-release.apk netspeed.apk
          SIZE=$(stat -c%s netspeed.apk); echo "APK size: $SIZE bytes"
          [ "$SIZE" -lt 1048576 ]
      - uses: actions/upload-artifact@v4
        with:
          name: netspeed-apk
          path: netspeed.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest netspeed.apk \
            --title "Latest build" --notes "Release APK from commit ${GITHUB_SHA::7}"
